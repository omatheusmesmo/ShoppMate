# Nome da aplicação
spring.application.name=shoppmate

# Configuração do banco de dados Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_SHOPP_MATE:SHOPPMATE}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASS:password}

# Configuração para criação/atualização automática de tabelas
spring.jpa.generate-ddl= false
spring.jpa.hibernate.ddl-auto= none

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#springdoc.api-docs.path=v3/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html

# 1h in millisecond
jwt.token.expiration=${JWT_TOKEN_EXPIRATION:3600000}

# RSA Key Paths for JWT Encryption (JWE)
# MUST be external files for production security.
jwt.private-key=${JWT_PRIVATE_KEY_PATH:file:./certs/private_key.pem}
jwt.public-key=${JWT_PUBLIC_KEY_PATH:file:./certs/public_key.pem}

# Rate Limiting
security.rate-limit.capacity=5
security.rate-limit.refill-tokens=5
security.rate-limit.refill-minutes=1

# Only rate limit mutating endpoints
security.rate-limit.enabled-methods[0]=POST
security.rate-limit.enabled-methods[1]=PUT

# Auth endpoints
security.rate-limit.included-paths[0]=/auth/login
security.rate-limit.included-paths[1]=/auth/sign

# Category endpoints
security.rate-limit.included-paths[2]=/category
security.rate-limit.included-paths[3]=/category/**

# Item endpoints
security.rate-limit.included-paths[4]=/item
security.rate-limit.included-paths[5]=/item/**

# Shopping list endpoints
security.rate-limit.included-paths[6]=/lists
security.rate-limit.included-paths[7]=/lists/**

# Unit endpoints
security.rate-limit.included-paths[8]=/unit
security.rate-limit.included-paths[9]=/unit/**