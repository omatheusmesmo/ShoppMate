# Test profile rate-limit settings.
# Database connection is supplied by AbstractIntegrationTest/Testcontainers.

# Sustained window
security.rate-limit.capacity=20
security.rate-limit.refill-tokens=20
security.rate-limit.refill-duration=PT1M

# Short burst window
security.rate-limit.short-burst-enabled=true
security.rate-limit.short-burst-capacity=5
security.rate-limit.short-burst-refill-tokens=5
security.rate-limit.short-burst-refill-duration=PT1S

# Penalty threshold
security.rate-limit.penalty-threshold=2

# Logging
logging.level.root=INFO
logging.level.com.omatheusmesmo.shoppmate.auth.configs.RateLimitFilter=TRACE
logging.level.com.omatheusmesmo.shoppmate.auth.configs.RateLimitFilterWindowingIntegrationTest=TRACE
logging.level.io.github.bucket4j=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
logging.level.org.springframework.security.web.access=TRACE
logging.level.org.springframework.security.web.csrf=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.testcontainers=INFO