# Test profile rate-limit settings.
# Database connection is supplied by AbstractIntegrationTest/Testcontainers.

# Sustained window
security.rate-limit.capacity=20
security.rate-limit.refill-tokens=20
security.rate-limit.refill-duration=PT1M

# Short burst window
security.rate-limit.short-burst-enabled=true
security.rate-limit.short-burst-capacity=5
security.rate-limit.short-burst-refill-tokens=5
security.rate-limit.short-burst-refill-duration=PT1S

# Penalty threshold
security.rate-limit.penalty-threshold=2

