# Nome da aplicação
spring.application.name=shoppmate

# Configuração do banco de dados Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_SHOPP_MATE:SHOPPMATE}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASS:password}

# Configuração para criação/atualização automática de tabelas
spring.jpa.generate-ddl= false
spring.jpa.hibernate.ddl-auto= none

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#springdoc.api-docs.path=v3/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html

# 1h in millisecond
jwt.token.expiration=${JWT_TOKEN_EXPIRATION:3600000}

# Secret key for HMAC signing (use a secure random string in production)
# Generate with: openssl rand -base64 64
jwt.secret.key=${JWT_SECRET_KEY:change-this-secret-key-in-production-use-at-least-256-bits}

# Sustained window
# Rate-limit capacity values should be tuned for production based on expected traffic,
# user behavior, and security requirements.
security.rate-limit.capacity=20
security.rate-limit.refill-tokens=20
security.rate-limit.refill-duration=PT1M

# Short burst window
# Short-burst values protect against rapid request spikes within the larger refill window.
security.rate-limit.short-burst-enabled=true
security.rate-limit.short-burst-capacity=5
security.rate-limit.short-burst-refill-tokens=5
security.rate-limit.short-burst-refill-duration=PT1S

# Penalty threshold
# Number of consecutive rate-limit violations before applying a persistent penalty.
# Keep this above 1 so normal users are not punished for one accidental burst.
security.rate-limit.penalty-threshold=2

# Only rate limit mutating endpoints
security.rate-limit.enabled-methods[0]=POST
security.rate-limit.enabled-methods[1]=PUT

# Auth endpoints
security.rate-limit.included-paths[0]=/auth/login
security.rate-limit.included-paths[1]=/auth/sign

# Category endpoints
security.rate-limit.included-paths[2]=/category
security.rate-limit.included-paths[3]=/category/**

# Item endpoints
security.rate-limit.included-paths[4]=/item
security.rate-limit.included-paths[5]=/item/**

# Shopping list endpoints
security.rate-limit.included-paths[6]=/lists
security.rate-limit.included-paths[7]=/lists/**

# Unit endpoints
security.rate-limit.included-paths[8]=/unit
security.rate-limit.included-paths[9]=/unit/**
